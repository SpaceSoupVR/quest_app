# Android NDK toolchain paths are machine-specific (they live under each
# developer's own $HOME and NDK version) — don't hardcode one developer's
# absolute path here, it silently breaks the build for everyone else.
#
# Instead, configure these once in your own global ~/.cargo/config.toml
# and/or shell profile:
#   [target.aarch64-linux-android]
#   ar     = ".../toolchains/llvm/prebuilt/<host>/bin/llvm-ar"
#   linker = ".../toolchains/llvm/prebuilt/<host>/bin/aarch64-linux-android<API>-clang"
# plus, for C/C++ deps like physx-sys that go through the `cc` crate
# (which reads these instead of Cargo's own linker setting):
#   CC_aarch64_linux_android / CXX_aarch64_linux_android / AR_aarch64_linux_android
