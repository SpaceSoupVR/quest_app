[package]
name        = "quest_app"
version     = "0.1.0"
edition     = "2021"
authors     = ["Your Name <you@example.com>"]
description = "A Quest VR app"

[lib]
name       = "quest_app"
crate-type = ["cdylib", "lib"]

[dependencies]
space_soup        = { path = "../space_soup", features = ["canvas"] }
space_soup_engine = { path = "../space_soup_engine" }
space_soup_hands  = { path = "../space_soup_hands" }
openxr            = { version = "0.18", features = ["loaded"] }
glam              = { version = "0.29", features = ["serde"] }
log               = "0.4"
env_logger        = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
ndk-glue       = { version = "0.7" }
ndk            = { version = "0.7" }

# network.rs is entirely `#[cfg(target_os = "android")]`-gated (this app has
# no non-Android runtime), so these stay Android-only rather than bloating
# host `cargo build`/`cargo test` (used throughout dev for avatar.rs etc).
space_soup_protocol = { path = "../space_soup_protocol" }
tokio               = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite   = "0.29"
futures-util        = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json          = "1.0"

# client_audio.rs plays WireWorld.sounds locally against this client's own
# head (see space_soup_engine::audio's doc comment on why the server can't
# be everyone's listener) — Android-only for the same reason as the rest of
# this section.
kira = "0.12.1"
mint = "0.5"

[profile.release]
opt-level = 3
lto       = true
strip     = true
