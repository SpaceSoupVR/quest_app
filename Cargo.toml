[package]
name        = "quest_app"
version     = "0.1.0"
edition     = "2021"
authors     = ["Your Name <you@example.com>"]
description = "A Quest VR app"

[lib]
name       = "quest_app"
crate-type = ["cdylib", "lib"]

[dependencies]
avatar_ik         = { path = "../avatar_ik" }
space_soup        = { path = "../space_soup", features = ["canvas"] }
space_soup_engine = { path = "../space_soup_engine" }
space_soup_hands  = { path = "../space_soup_hands" }
# Not in the Android block: it is engine-free, platform-free data, and keeping it
# there is what stopped the wire conversions from being testable off a headset.
space_soup_protocol = { path = "../space_soup_protocol" }
openxr            = { version = "0.18", features = ["loaded"] }
glam              = { version = "0.29", features = ["serde"] }
log               = "0.4"
env_logger        = "0.11"
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
ndk-glue       = { version = "0.7" }
ndk            = { version = "0.7" }

tokio               = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite   = "0.29"
futures-util        = { version = "0.3", default-features = false, features = ["sink", "std"] }
image               = { version = "0.25.5", default-features = false, features = ["png"] }
base64              = "0.22"

kira = "0.12.1"
mint = "0.5"

[profile.release]
opt-level = 3
lto       = true
strip     = true

# The offline frame renderer (`src/offline_frame.rs`, tests only): draws a
# level through the headset's own shaders on the development machine.
[dev-dependencies]
wgpu     = "30.0.1"
pollster = "0.3"
image    = { version = "0.25.5", default-features = false, features = ["png"] }

# THE SPACESOUPVR FORK OF wgpu 30.0.1 (github.com/SpaceSoupVR/wgpu, branch
# `spacesoup/v30.0.1`), cloned beside this repo as `../wgpu`. Every crate from
# that repo is patched together: patching naga alone would pull in a second
# copy of `naga-types`. What the fork changes is in its SPACESOUP.md; first,
# naga declares the 16-bit STORAGE capabilities only for buffers that hold a
# 16-bit type, so `f16` arithmetic works on Adreno (gpuweb#5006).
[patch.crates-io]
naga = { path = "../wgpu/naga" }
naga-types = { path = "../wgpu/naga-types" }
wgpu = { path = "../wgpu/wgpu" }
wgpu-core = { path = "../wgpu/wgpu-core" }
wgpu-hal = { path = "../wgpu/wgpu-hal" }
wgpu-types = { path = "../wgpu/wgpu-types" }
wgpu-naga-bridge = { path = "../wgpu/wgpu-naga-bridge" }
wgpu-core-deps-apple = { path = "../wgpu/wgpu-core/platform-deps/apple" }
wgpu-core-deps-emscripten = { path = "../wgpu/wgpu-core/platform-deps/emscripten" }
wgpu-core-deps-windows-linux-android = { path = "../wgpu/wgpu-core/platform-deps/windows-linux-android" }
