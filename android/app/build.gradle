plugins {
    id 'com.android.application'
}
android {
    namespace 'com.example.questapp'
    compileSdk 35
    ndkVersion "27.0.12077973"
    defaultConfig {
        applicationId "com.example.questapp"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['../jniLibs']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.60'
}